  windows-verified-bridge-restore:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Verify exact previously tested source and test runner
          command: |
            $ErrorActionPreference = 'Stop'
            # One-time V0.1.0 candidate path. Only config.yml may differ from
            # the reviewed Pipeline #19 tree. All source, tests, dependencies,
            # submodule references, build scripts and other files must match.
            $expectedRoot = @(
              '040000 tree 597388deb65527183d44071d1905b06b747c03e9 .cargo',
              '100644 blob 176a458f94e0ea5272ce67c36bf30b6be9caf623 .gitattributes',
              '040000 tree 7f9839031cd0799ecee2e0df70806cb316be0920 .github',
              '100644 blob 07e207d892b603bffe7f2136d9cfb4ac97ad6ea6 .gitignore',
              '100644 blob d80e69aa84a4c7f764eea191622a386878cf852d .gitmodules',
              '100644 blob 1f41b7517837fee4e2c98b7873c607d93205102c AGENTS.md',
              '100644 blob 56cbcae8ec016320c55a83e1e0415c1490639dc2 Cargo.lock',
              '100644 blob 625f45d5c9c24a4e1325e7d243371b93801d9cac Cargo.toml',
              '100644 blob 768c2520342fb4fdfbee02675601c9113fc031c1 Dockerfile',
              '100644 blob 43c994c2d3617f947bcb5adf1933e21dabe46bb5 GEMINI.md',
              '100644 blob 0ad25db4bd1d86c452db3f9602ccdbe172438f52 LICENCE',
              '100644 blob 38433e0afced9361a77254f6b5499c86066dae03 README.md',
              '040000 tree 4a85341fad02233c586aa254d3ff22fc6354d47c appimage',
              '100755 blob 1270b739f5935f0c0801ed57fd6361250a8fd84b build.py',
              '100644 blob 30e486a4bfab8a5c0494043e2eba13220eea6c2e build.rs',
              '040000 tree 59a624e32e6c12a413ee8077170a6dab66570b51 docs',
              '100755 blob bd1898e4d98141ccbdcc6e6877868058601dadbb entrypoint.sh',
              '040000 tree 186ad8c0fd1e3ea3e4c85cf38dd0436d178c44a8 examples',
              '040000 tree ddad04dd91dc5dca803df825eb7dc936cf2f0472 fastlane',
              '040000 tree de264bc1af15a61ee91a211d8fe0ed79b429410f flatpak',
              '040000 tree c6409d62bb99204cf4fc85c2f8375e11c57dc7ce flutter',
              '040000 tree 1471273e95d64da041550eaa44d32cf59a535c56 infra',
              '040000 tree 9aef21537e527fca11199acf6dd3da2897faf654 libs',
              '040000 tree ecffb65c76346eb7eeb7d36c3a46677eca782017 res',
              '040000 tree dd3953aefed35760af292ec1e2b36b910e48c32e src',
              '100644 blob d1cd4044a123ac906d6b6b065798e4f24c87cc8d vcpkg.json'
            )
            $expectedCI = @(
              '100644 blob 453e7bbe129ff4f0c48885419eb2e6cd11866e92 probe-chrome.ps1',
              '100644 blob d58cc78965bd77992f6f61f834cb036b99d53950 probe-installer-acl.ps1',
              '100644 blob 5f70eebe76a10bca99f95aa7f78df501a6da7a7d test-suites.yml',
              '100644 blob 64ef094ab3374e386f85adf8de2390c6ef915610 test_runner.py'
            )
            $rootLines = @(git ls-tree HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read checkout tree.' }
            $ciLines = @(git ls-tree HEAD:.circleci)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read CircleCI tree.' }
            $actualRoot = @($rootLines | ForEach-Object { $_ -replace '\t',' ' } | Where-Object { $_ -notmatch ' \.circleci$' })
            $actualCI = @($ciLines | ForEach-Object { $_ -replace '\t',' ' } | Where-Object { $_ -notmatch ' config\.yml$' })
            if ($actualRoot.Count -ne $expectedRoot.Count -or @(Compare-Object -ReferenceObject $expectedRoot -DifferenceObject $actualRoot -CaseSensitive).Count -ne 0) {
              throw 'Source differs from the verified V0.1.0 tree. Use the full release-candidate workflow.'
            }
            if ($actualCI.Count -ne $expectedCI.Count -or @(Compare-Object -ReferenceObject $expectedCI -DifferenceObject $actualCI -CaseSensitive).Count -ne 0) {
              throw 'Test runner or other CI files changed. Use the full release-candidate workflow.'
            }
            $revision = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read checkout revision.' }
            Write-Host "VERIFIED_V010_SOURCE_OK=$revision; evidence=8d7a5749f8e56f4957ab2b07d5b9e4152cd6b186"
      - run:
          name: Calculate source identity for generated bridge cache
          command: |
            $ErrorActionPreference = 'Stop'
            $identity = @('bridge-v1-flutter-3.22.3-codegen-1.80.1-expand-1.0.95-rust-1.75.0')
            foreach ($path in @('src','flutter','libs','Cargo.toml','Cargo.lock','.cargo')) {
              $object = git rev-parse "HEAD:$path"
              if ($LASTEXITCODE -ne 0) { throw "Cannot identify bridge input $path" }
              $identity += $object
            }
            $identity | Set-Content -LiteralPath '.mr-bridge-cache-key' -Encoding ASCII
      - restore_cache:
          keys:
            - 'mr-bridge-v1-win-x64-{{ checksum ".mr-bridge-cache-key" }}'
      - run:
          name: Restore verified Bridge without native bootstrap
          command: |
            $ErrorActionPreference = 'Stop'
            $files = @('src/bridge_generated.rs','src/bridge_generated.io.rs','flutter/lib/generated_bridge.dart','flutter/lib/generated_bridge.freezed.dart','flutter/macos/Runner/bridge_generated.h','flutter/ios/Runner/bridge_generated.h')
            foreach ($file in $files) {
              $item = Get-Item -LiteralPath (Join-Path '.mr-bridge' $file) -ErrorAction Stop
              if ($item.PSIsContainer -or $item.Length -le 0) { throw "Invalid cached Bridge file: $file" }
              Write-Host "BRIDGE_FILE=$file; SHA256=$((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash)"
            }
            Write-Host 'VERIFIED_BRIDGE_CACHE_OK (no regeneration)'
      - persist_to_workspace:
          root: .mr-bridge
          paths:
            - src
            - flutter

  windows-visual-preview-input:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Guard visual-only changes against homologated V0.1.0
          command: |
            $ErrorActionPreference = 'Stop'
            $baseline = '5d5eb048d21fc1e9095c138117e89a5102424851'
            $null = git cat-file -t $baseline 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags origin $baseline
              if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch approved baseline.' }
            }
            $null = git merge-base --is-ancestor $baseline HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Checkout is not descended from approved baseline.' }
            $changes = @(git -c core.quotepath=true diff --no-renames --name-only $baseline HEAD --)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect changed files.' }
            $blocked = @($changes | Where-Object {
              $_ -cne '.circleci/config.yml' -and
              $_ -cne 'flutter/lib/main.dart' -and
              $_ -cnotmatch '^flutter/lib/(desktop/|common/widgets/)[A-Za-z0-9_./-]+\.dart$'
            })
            if ($blocked.Count -gt 0) {
              $blocked | ForEach-Object { Write-Host "BLOCKED_PREVIEW_PATH=$_" }
              throw 'Changes outside visual preview scope. Use full release-candidate workflow.'
            }
            # Only the reviewed main.dart window-startup change is allowed.
            # Any further change to this entry point requires a fresh review.
            if ($changes -ccontains 'flutter/lib/main.dart') {
              $mainBlob = git rev-parse 'HEAD:flutter/lib/main.dart'
              if ($LASTEXITCODE -ne 0 -or $mainBlob -cne 'b1a20afc8c79d8adb2314b7c975fa4d06a89e9d5') {
                throw 'Unreviewed main.dart change. Use full release-candidate workflow.'
              }
            }
            foreach ($file in @($changes | Where-Object { $_ -cne '.circleci/config.yml' })) {
              $entry = @(git ls-tree HEAD -- $file)
              if ($LASTEXITCODE -ne 0) { throw "Cannot verify file mode: $file" }
              if ($entry.Count -gt 0 -and $entry[0] -notmatch '^100644 blob ') { throw "Non-regular preview file: $file" }
            }
            $dirty = @(git status --porcelain --untracked-files=no)
            if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Checkout is not clean.' }
            Write-Host "VISUAL_PREVIEW_SCOPE_OK; baseline=$baseline; changed=$($changes.Count)"
      - run:
          name: Calculate source identity for generated bridge cache
          command: |
            $ErrorActionPreference = 'Stop'
            $identity = @('bridge-v1-flutter-3.22.3-codegen-1.80.1-expand-1.0.95-rust-1.75.0')
            foreach ($path in @('src','flutter','libs','Cargo.toml','Cargo.lock','.cargo')) {
              $object = git rev-parse "5d5eb048d21fc1e9095c138117e89a5102424851:$path"
              if ($LASTEXITCODE -ne 0) { throw "Cannot identify bridge input $path" }
              $identity += $object
            }
            $identity | Set-Content -LiteralPath '.mr-bridge-cache-key' -Encoding ASCII
      - restore_cache:
          keys:
            - 'mr-bridge-v1-win-x64-{{ checksum ".mr-bridge-cache-key" }}'
      - run:
          name: Verify cached Bridge for baseline ABI
          command: |
            $ErrorActionPreference = 'Stop'
            $files = @('src/bridge_generated.rs','src/bridge_generated.io.rs','flutter/lib/generated_bridge.dart','flutter/lib/generated_bridge.freezed.dart','flutter/macos/Runner/bridge_generated.h','flutter/ios/Runner/bridge_generated.h')
            foreach ($file in $files) {
              $item = Get-Item -LiteralPath (Join-Path '.mr-bridge' $file) -ErrorAction Stop
              if ($item.PSIsContainer -or $item.Length -le 0) { throw "Invalid cached Bridge file: $file" }
              Write-Host "BRIDGE_FILE=$file; SHA256=$((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash)"
            }
            Write-Host 'VISUAL_PREVIEW_BRIDGE_OK'
      - restore_cache:
          keys:
            - mr-visual-core-v1-win-x64-e940b0d1165daf3782ab154d6b2ad17fc45eac7812dd87336a1a18c1e3878068-zip
      - run:
          name: Restore and verify approved Rust release libraries
          command: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            $repo = (Get-Location).Path
            $cacheDir = Join-Path $repo '.mr-visual-core-cache'
            New-Item -ItemType Directory -Force $cacheDir | Out-Null
            $zip = Join-Path $cacheDir 'v0.1.0.zip'
            $expected = 'e940b0d1165daf3782ab154d6b2ad17fc45eac7812dd87336a1a18c1e3878068'
            if (Test-Path -LiteralPath $zip -PathType Leaf) {
              if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine $expected) { Remove-Item -LiteralPath $zip -Force }
            }
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/raffaelpereirasilva94-rgb/rustdesk/releases/download/v0.1.0/MRRemote-v0.1.0-windows-x64-test-unsigned.zip' -OutFile $zip
              Write-Host 'VISUAL_CORE_CACHE_MISS_DOWNLOADED_APPROVED_RELEASE'
            } else { Write-Host 'VISUAL_CORE_CACHE_HIT' }
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine $expected) { throw 'Approved release archive SHA256 mismatch.' }
            $extract = Join-Path $repo '.mr-visual-core-extract'
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $out = Join-Path $repo '.mr-visual-core'
            $mapping = @{
              'librustdesk.dll' = 'target/release/librustdesk.dll'
              'dylib_virtual_display.dll' = 'target/release/deps/dylib_virtual_display.dll'
            }
            foreach ($name in $mapping.Keys) {
              $source = Get-Item -LiteralPath (Join-Path $extract $name) -ErrorAction Stop
              if ($source.PSIsContainer -or $source.Length -le 0) { throw "Invalid approved DLL: $name" }
              $destination = Join-Path $out $mapping[$name]
              New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $source.FullName -Destination $destination -Force
              Write-Host "APPROVED_CORE_DLL=$name; SHA256=$((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash)"
            }
            $features = (& python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $features -notmatch '^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$') { throw 'Cannot resolve approved feature flags.' }
            foreach ($feature in @('flutter','hwcodec','vram')) {
              if (($features -split ',') -notcontains $feature) { throw "Missing required feature: $feature" }
            }
            $features | Set-Content -LiteralPath (Join-Path $out 'release-features.txt') -Encoding ASCII
            Write-Host 'VISUAL_PREVIEW_CORE_OK (approved release DLLs; no Rust compilation)'
          no_output_timeout: 5m
      - save_cache:
          key: mr-visual-core-v1-win-x64-e940b0d1165daf3782ab154d6b2ad17fc45eac7812dd87336a1a18c1e3878068-zip
          paths:
            - .mr-visual-core-cache
      - persist_to_workspace:
          root: .mr-bridge
          paths:
            - src
            - flutter
      - persist_to_workspace:
          root: .mr-visual-core
          paths:
            - target/release/librustdesk.dll
            - target/release/deps/dylib_virtual_display.dll
            - release-features.txt

  windows-visual-preview-package:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - attach_workspace:
          at: .mr-preview-input
      - run:
          name: Package unsigned visual preview only
          command: |
            $ErrorActionPreference = 'Stop'
            $repo = (Get-Location).Path
            $app = Join-Path $repo '.mr-preview-input\windows-app'
            $out = Join-Path $repo '.mr-preview-output'
            New-Item -ItemType Directory -Force $out | Out-Null
            $revision = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot identify preview revision.' }
            foreach ($file in @('rustdesk.exe','librustdesk.dll','dylib_virtual_display.dll','flutter_windows.dll','data\app.so','data\icudtl.dat')) {
              $item = Get-Item -LiteralPath (Join-Path $app $file) -ErrorAction Stop
              if ($item.PSIsContainer -or $item.Length -le 0) { throw "Missing preview file: $file" }
            }
            foreach ($name in @('librustdesk.dll','dylib_virtual_display.dll')) {
              $relative = if ($name -eq 'librustdesk.dll') { 'target/release/librustdesk.dll' } else { 'target/release/deps/dylib_virtual_display.dll' }
              $original = Join-Path (Join-Path $repo '.mr-preview-input') $relative
              if ((Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath (Join-Path $app $name) -Algorithm SHA256).Hash) { throw "Preview DLL mismatch: $name" }
            }
            $zipName = if ('<< pipeline.parameters.validation_suite >>' -eq 'client-preview') {
              'MRRemote-v0.2-client-preview-windows-x64-unsigned.zip'
            } else {
              'MRRemote-v0.2-visual-preview-windows-x64-unsigned.zip'
            }
            $zip = Join-Path $out $zipName
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [IO.Compression.ZipFile]::CreateFromDirectory($app,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$zipName" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII
            @("preview_commit=$revision","core_commit=5d5eb048d21fc1e9095c138117e89a5102424851","core_release_sha256=e940b0d1165daf3782ab154d6b2ad17fc45eac7812dd87336a1a18c1e3878068","preview_sha256=$hash","scope=visual preview only; supplemental drivers omitted; not a release or test approval") | Set-Content -LiteralPath (Join-Path $out 'preview-provenance.txt') -Encoding ASCII
            Write-Host 'VISUAL_PREVIEW_PACKAGE_OK (unsigned UI preview; not a release)'
      - store_artifacts:
          path: .mr-preview-output
          destination: mr-remote-visual-preview

workflows:
  validate:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [all, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
  release-candidate:
    when:
      and:
        - << pipeline.parameters.build_distribution >>
        - not:
            equal: [package-verified, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
      - windows-core-build:
          requires:
            - windows-rust-core-tests
            - windows-rust-clipboard-tests
            - windows-flutter-tests
      - windows-flutter-build:
          requires:
            - windows-core-build
      - windows-package:
          requires:
            - windows-flutter-build

  validate-rust-core:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [rust-core, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
  validate-clipboard:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [clipboard, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
            - windows-native-bootstrap
  validate-flutter:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [flutter, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
  diagnose-windows-owner:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [owner-probe, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-owner-probe
  validate-rust-flutter:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [rust-flutter, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
  diagnose-acl-chrome:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [acl-chrome-probe, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-acl-chrome-probe
  validate-flutter-browser:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [flutter-browser, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-flutter-browser-tests
  package-verified-v010:
    when:
      and:
        - << pipeline.parameters.build_distribution >>
        - equal: [package-verified, << pipeline.parameters.validation_suite >>]
        - not: << pipeline.parameters.smarter_testing >>
    jobs:
      - windows-verified-bridge-restore
      - windows-core-build:
          requires:
            - windows-verified-bridge-restore
      - windows-flutter-build:
          requires:
            - windows-core-build
      - windows-package:
          requires:
            - windows-flutter-build
  visual-preview-v020:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - not: << pipeline.parameters.smarter_testing >>
        - equal: [visual-preview, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-visual-preview-input
      - windows-flutter-build:
          requires:
            - windows-visual-preview-input
      - windows-visual-preview-package:
          requires:
            - windows-flutter-build
  client-preview-v020:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - not: << pipeline.parameters.smarter_testing >>
        - equal: [client-preview, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-visual-preview-input
      - windows-flutter-build:
          mr_client_preview: true
          requires:
            - windows-visual-preview-input
      - windows-visual-preview-package:
          requires:
            - windows-flutter-build
