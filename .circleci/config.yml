  diagnose-windows-owner:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [owner-probe, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-owner-probe
  validate-rust-flutter:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [rust-flutter, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
