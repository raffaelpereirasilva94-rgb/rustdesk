            Write-Host "VCPKG_CACHE_FILES_BEFORE_INSTALL=$($restoredFiles.Count)"
            $env:VCPKG_BINARY_SOURCES = "clear;files,$cachePath,readwrite"
            $env:VCPKG_DEFAULT_HOST_TRIPLET = 'x64-windows-static'
            $env:VCPKG_MAX_CONCURRENCY = '4'
            $installed = Join-Path $vcpkg 'installed'
            Write-Host "VCPKG_ROOT=$vcpkg"
            Write-Host "VCPKG_BINARY_CACHE=$cachePath"
            Write-Host 'Installing the original RustDesk vcpkg manifest (x64-windows-static).'
            & "$vcpkg\vcpkg.exe" install --triplet x64-windows-static --host-triplet x64-windows-static "--x-install-root=$installed" --clean-after-build
            Assert-NativeExit 'vcpkg manifest installation'
            if (-not (Test-Path (Join-Path $installed 'vcpkg\status'))) { throw 'vcpkg installed status missing.' }
            foreach ($package in @('aom','libjpeg-turbo','opus','libvpx','libyuv','mfx-dispatch','ffmpeg')) {
              $listFiles = @(Get-ChildItem -Path (Join-Path $installed 'vcpkg\info') -Filter "$($package)_*x64-windows-static.list" -ErrorAction Stop)
              if ($listFiles.Count -eq 0) { throw "Expected installed package missing: $package" }
              Write-Host "Installed: $package"
            }
            $cacheFiles = @(Get-ChildItem -LiteralPath $cachePath -File -Recurse)
            $cacheBytes = ($cacheFiles | Measure-Object Length -Sum).Sum
            if ($cacheFiles.Count -eq 0) { throw 'No binary cache packages found.' }
            Write-Host "Cache files: $($cacheFiles.Count); size MiB: $([math]::Round($cacheBytes/1MB,2))"
            Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{N='Free_GiB';E={[math]::Round($_.Free/1GB,2)}} | Format-Table
            Write-Host 'VCPKG_LIBRARIES_OK (native dependencies only; no application build or tests)'
          no_output_timeout: 15m
      - save_cache:
          key: 'mr-vcpkg-v1-win2022-vs17-x64-static-9e593bb1-{{ checksum ".mr-vcpkg-cache-key" }}'
          paths:
            - .mr-vcpkg-binary-cache

      - attach_workspace:
          at: .mr-bridge-input
      - run:
          name: Run rust clipboard tests without distribution build
          command: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            function Assert-NativeExit([string]$action) {
              if ($LASTEXITCODE -ne 0) { throw "$action failed (exit $LASTEXITCODE)" }
            }
            $repo = (Get-Location).Path
            $root = 'C:\mr-native-tools'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Assert-NativeExit 'VS 2022 discovery'
            if (-not $vs) { throw 'Visual Studio 2022 x64 is missing.' }
            $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw 'vcvars64.bat missing.' }
            $devCommand = 'call "' + $vcvars + '" >nul && set'
            $devEnvironment = & cmd.exe /d /c $devCommand
            Assert-NativeExit 'MSVC x64 environment initialization'
            foreach ($line in $devEnvironment) {
              if ($line -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($Matches[1],$Matches[2],'Process')
              }
            }
            $env:CARGO_HOME = Join-Path $root 'cargo'
            $env:RUSTUP_HOME = Join-Path $root 'rustup'
            $env:RUSTUP_TOOLCHAIN = '1.75.0-x86_64-pc-windows-msvc'
            $env:LIBCLANG_PATH = Join-Path $root 'llvm\bin'
            $env:VCPKG_ROOT = Join-Path $root 'vcpkg'
            $env:VCPKG_VISUAL_STUDIO_PATH = $vs
            $env:VCPKG_DEFAULT_HOST_TRIPLET = 'x64-windows-static'
            $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static'
            $env:CARGO_BUILD_JOBS = '4'
            $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin'
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            $env:Path = "$env:CARGO_HOME\bin;$env:LIBCLANG_PATH;$cmake;$ninja;C:\Program Files\Git\bin;$env:Path"
            $compiler = Get-Command cl.exe -ErrorAction Stop
            Write-Host "MSVC compiler: $($compiler.Source)"
            if ($compiler.Source -notlike "$vs\*") { throw 'Unexpected MSVC compiler.' }
            $rustVersion = & rustc --version
            Assert-NativeExit 'Rust version'
            if ($rustVersion -notmatch '^rustc 1\.75\.0 ') { throw "Unexpected Rust version: $rustVersion" }
            Write-Host $rustVersion
            git submodule update --init --recursive
            Assert-NativeExit 'Repository submodules'
            $files = @(
              'src/bridge_generated.rs',
              'src/bridge_generated.io.rs',
              'flutter/lib/generated_bridge.dart',
              'flutter/lib/generated_bridge.freezed.dart',
              'flutter/macos/Runner/bridge_generated.h',
              'flutter/ios/Runner/bridge_generated.h'
            )
            foreach ($file in $files) {
              $source = Join-Path (Join-Path $repo '.mr-bridge-input') $file
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing bridge workspace file: $file" }
              if ((Get-Item -LiteralPath $source).Length -le 0) { throw "Empty bridge workspace file: $file" }
              Copy-Item -LiteralPath $source -Destination (Join-Path $repo $file) -Force
            }
            # Match the original build.py Windows sequence and release feature flags.
            $features = (& python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features | Out-String).Trim()
            Assert-NativeExit 'Resolve release features'
            if ($features -notmatch '^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$') { throw "Invalid feature list: $features" }
            foreach ($feature in @('flutter','hwcodec','vram')) {
              if (($features -split ',') -notcontains $feature) { throw "Missing required feature: $feature" }
            }
            Write-Host "MR_RELEASE_FEATURES=$features"
            $linker = Join-Path (Split-Path -Parent $compiler.Source) 'link.exe'
            if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw "MSVC linker missing: $linker" }
            $env:MR_MSVC_LINKER = $linker
            $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $linker
            $env:Path = "$(Split-Path -Parent $linker);$env:Path"
            Write-Host "Selected MSVC linker: $linker"
            $env:MR_RELEASE_FEATURES = $features
            $env:PYTHONUTF8 = '1'
            # Only the test jobs use the lighter release compilation profile.
            # Production builds keep Cargo.toml's original release profile.
            $env:CARGO_PROFILE_RELEASE_LTO = 'off'
            $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '16'
            $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '1'
            $env:CARGO_PROFILE_RELEASE_DEBUG = '0'
            Write-Host 'MR_TEST_PROFILE=release; lto=off; codegen-units=16; opt-level=1'
            if ('<< pipeline.parameters.smarter_testing >>' -eq 'true') {
              circleci testsuite doctor 'rust clipboard'
              Assert-NativeExit 'rust clipboard doctor'
              circleci testsuite run 'rust clipboard'
              Assert-NativeExit 'rust clipboard run'
            } else {
              $atoms = @(python .circleci/test_runner.py discover rust-clipboard)
              Assert-NativeExit 'rust clipboard discovery'
              if ($atoms.Count -eq 0) { throw 'No test atoms discovered.' }
              python -u .circleci/test_runner.py run rust-clipboard ".mr-test-results/rust-clipboard/junit.xml" @atoms
              Assert-NativeExit 'rust clipboard native tests'
            }
            Write-Host 'RUST_CLIPBOARD_TESTS_OK'
          no_output_timeout: 15m
      - store_test_results:
          path: .mr-test-results
      - store_artifacts:
          path: .mr-test-results
          destination: rust-clipboard-test-reports
      - store_artifacts:
          path: .mr-test-logs
          destination: rust-clipboard-test-logs

  windows-flutter-tests:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - attach_workspace:
          at: .mr-build-input
      - run:
          name: Run Flutter tests without Windows distribution build
          command: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            function Assert-NativeExit([string]$action) {
              if ($LASTEXITCODE -ne 0) { throw "$action failed (exit $LASTEXITCODE)" }
            }
            $repo = (Get-Location).Path
            $workspace = Join-Path $repo '.mr-build-input'
            $files = @(
              'src/bridge_generated.rs',
              'src/bridge_generated.io.rs',
              'flutter/lib/generated_bridge.dart',
              'flutter/lib/generated_bridge.freezed.dart',
              'flutter/macos/Runner/bridge_generated.h',
              'flutter/ios/Runner/bridge_generated.h'
            )
            foreach ($file in $files) {
              $source = Join-Path $workspace $file
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing workspace input: $file" }
              if ((Get-Item -LiteralPath $source).Length -le 0) { throw "Empty workspace input: $file" }
              $destination = Join-Path $repo $file
              New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $source -Destination $destination -Force
              Write-Host "Restored: $file"
            }
            git submodule update --init --recursive
            Assert-NativeExit 'Repository submodules'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Assert-NativeExit 'Visual Studio discovery'
            if (-not $vs) { throw 'Visual Studio 2022 x64 is missing.' }
            $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin'
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            $flutterRoot = 'C:\mr-flutter-release'
            git clone --depth 1 --branch 3.24.5 https://github.com/flutter/flutter.git $flutterRoot
            Assert-NativeExit 'Flutter release SDK checkout'
            $env:Path = "$flutterRoot\bin;$cmake;$ninja;C:\Program Files\Git\bin;$env:Path"
            $env:CI = 'true'
            $env:FLUTTER_SUPPRESS_ANALYTICS = 'true'
            $flutter = Join-Path $flutterRoot 'bin\flutter.bat'
            $flutterVersion = & $flutter --version | Out-String
            Assert-NativeExit 'Flutter release SDK initialization'
            Write-Host $flutterVersion
            if ($flutterVersion -notmatch 'Flutter 3\.24\.5\b') { throw 'Unexpected Flutter version.' }
            & $flutter config --no-analytics
            Assert-NativeExit 'Disable Flutter analytics'
            & $flutter precache --windows
            Assert-NativeExit 'Windows engine precache'
            $patch = Join-Path $repo '.github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff'
            git -C $flutterRoot apply --check $patch
            Assert-NativeExit 'Flutter release patch compatibility'
            git -C $flutterRoot apply $patch
            Assert-NativeExit 'Apply Flutter release patch'
            Write-Host 'FLUTTER_TEST_SDK_AND_PATCH_OK'
            # The repository contains a browser-only test. Use Chrome if
            # present; otherwise provision it only on this ephemeral test VM.
            $chromeCandidates = @($env:CHROME_EXECUTABLE,
              (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
              (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'))
            $chrome = $chromeCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
            if (-not $chrome) {
              Get-Command choco -ErrorAction Stop | Out-Null
              choco install googlechrome --yes --no-progress
              if ($LASTEXITCODE -notin @(0,1641,3010)) { throw "Chrome installation failed (exit $LASTEXITCODE)" }
              $chrome = $chromeCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
            }
            if (-not $chrome) { throw 'Chrome executable not found.' }
            $env:CHROME_EXECUTABLE = $chrome
            Write-Host "CHROME_EXECUTABLE=$chrome"
            & $flutter precache --web
            Assert-NativeExit 'Flutter web engine precache'
            Push-Location (Join-Path $repo 'flutter')
            try {
              & $flutter pub get
              Assert-NativeExit 'Flutter release dependencies'
            } finally { Pop-Location }
            $env:PYTHONUTF8 = '1'
            if ('<< pipeline.parameters.smarter_testing >>' -eq 'true') {
              circleci testsuite doctor 'flutter tests'
              Assert-NativeExit 'flutter tests doctor'
              circleci testsuite run 'flutter tests'
              Assert-NativeExit 'flutter tests run'
            } else {
              $atoms = @(python .circleci/test_runner.py discover flutter)
              Assert-NativeExit 'flutter tests discovery'
              if ($atoms.Count -eq 0) { throw 'No test atoms discovered.' }
              python -u .circleci/test_runner.py run flutter ".mr-test-results/flutter/junit.xml" @atoms
              Assert-NativeExit 'flutter tests native tests'
            }
            Write-Host 'FLUTTER_AUTOMATED_TESTS_OK'
          no_output_timeout: 15m
      - store_test_results:
          path: .mr-test-results
      - store_artifacts:
          path: .mr-test-results
          destination: flutter-test-reports
      - store_artifacts:
          path: .mr-test-logs
          destination: flutter-test-logs


  windows-owner-probe:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - run:
          name: Inspect Windows default ownership without compiling
          command: |
            $ErrorActionPreference = 'Stop'
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = New-Object Security.Principal.WindowsPrincipal($identity)
            $root = Join-Path $env:TEMP ("mr-owner-probe-" + [Guid]::NewGuid())
            try {
              New-Item -ItemType Directory -Path $root | Out-Null
              $file = Join-Path $root 'probe.txt'
              Set-Content -LiteralPath $file -Value 'owner probe'
              Write-Host "TOKEN_USER_SID=$($identity.User.Value)"
              Write-Host "TOKEN_OWNER_SID=$($identity.Owner.Value)"
              Write-Host "TOKEN_IS_ADMIN=$($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
              foreach ($item in @($root,$file)) {
                $acl = Get-Acl -LiteralPath $item
                Write-Host "OBJECT_OWNER_SID=$($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value)"
              }
              Write-Host 'WINDOWS_OWNER_PROBE_OK'
            } finally {
              if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            }

workflows:
  validate:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [all, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
  release-candidate:
    when: << pipeline.parameters.build_distribution >>
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
            - windows-native-bootstrap
      - windows-flutter-tests:
          requires:
            - windows-native-bootstrap
      - windows-core-build:
          requires:
            - windows-rust-core-tests
            - windows-rust-clipboard-tests
            - windows-flutter-tests
      - windows-flutter-build:
          requires:
            - windows-core-build
      - windows-package:
          requires:
            - windows-flutter-build

  validate-rust-core:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [rust-core, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-core-tests:
          requires:
            - windows-native-bootstrap
  validate-clipboard:
    when:
      and:
        - not: << pipeline.parameters.build_distribution >>
        - equal: [clipboard, << pipeline.parameters.validation_suite >>]
    jobs:
      - windows-native-bootstrap
      - windows-rust-clipboard-tests:
          requires:
