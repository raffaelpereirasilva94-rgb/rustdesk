# MR Remote fork: Windows x64 validation only; upstream multi-platform build is preserved separately.
name: Full Flutter CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  run-ci:
    uses: ./.github/workflows/mr-remote-windows.yml
