services:
  hbbs:
    image: ghcr.io/rustdesk/rustdesk-server:1.1.16
    container_name: hbbs
    command: ["hbbs", "-r", "${RUSTDESK_PUBLIC_HOST:?Set RUSTDESK_PUBLIC_HOST}:21117", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  hbbr:
    image: ghcr.io/rustdesk/rustdesk-server:1.1.16
    container_name: hbbr
    command: ["hbbr", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
